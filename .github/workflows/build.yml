name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk python3-pip zip unzip libffi-dev libssl-dev
          pip install buildozer==1.5.0 cython==0.29.33 kivy
          yes | buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Matrix-APK
          path: bin/*.apk
