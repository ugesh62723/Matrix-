name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev python3-dev build-essential libtool automake cmake gettext zip unzip openjdk-17-jdk

    - name: Install Buildozer & Cython
      run: |
        python -m pip install --upgrade pip setuptools
        pip install buildozer cython==0.29.33

    - name: Create buildozer.spec Automatically
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Matrix
        package.name = matrix
        package.domain = org.yuvraj
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,json,txt
        version = 1.0
        requirements = python3,kivy
        orientation = portrait
        osx.python_version = 3
        osx.kivy_version = 1.9.1
        fullscreen = 0
        android.permissions = INTERNET
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.accept_sdk_license = True
        android.archs = arm64-v8a, armeabi-v7a

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Matrix-App
        path: bin/*.apk
