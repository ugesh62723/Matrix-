name: Build Matrix APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache git libffi-dev libssl-dev python3-dev build-essential libtool automake cmake gettext zip unzip openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install Cython==0.29.33 buildozer

    - name: Build APK Action
      uses: Artemis-dk/buildozer-action@v1.2
      with:
        workdir: .
        buildozer_version: master

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Matrix-App
        path: bin/*.apk
        
